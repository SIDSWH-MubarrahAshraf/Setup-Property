<div class="erp-container full-width">


  <!-- ================= MAIN CARD ================= -->
  <div class="erp-card full-width-card">

    <div class="card-header">
      <h4>Document Number Setup</h4>
    </div>

    <div class="card-body">

      <!-- ================= SEARCH BAR ================= -->
      <div class="search-bar">

        <!-- Document ID Search -->
        <div class="search-field">
          <label class="form-label">Document ID</label>
          <input
            type="text"
            class="form-control compact-input"
            placeholder="Search Document ID..."
            [(ngModel)]="searchText">
        </div>

        <!-- Buttons -->
        <div class="search-actions">

          <button
            type="button"
            class="btn erp-btn-search"
            (click)="searchModule()">

            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
            Search
          </button>

          <button
            type="button"
            class="btn erp-btn-secondary"
            (click)="refreshModules()">

            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
            Refresh
          </button>

        </div>

      </div>

      <!-- ================= TABLE ================= -->
      <div class="table-wrapper">

        <table class="erp-table full-table">

          <thead>
            <tr>
              <th width="60">Sr</th>
              <th>Document ID</th>
              <th>Module Name</th>
              <th width="120">Length</th>
              <th width="120">Prefix</th>
              <th width="140">Number</th>
              <th width="90" class="text-center">Action</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let module of filteredModules; let i = index">

              <td>
                <span class="serial-badge">
                  {{ i + 1 }}
                </span>
              </td>

              <td>
                <strong>{{ module.documentId }}</strong>
              </td>

              <td>
                {{ module.moduleName }}
              </td>

              <td>
                <span class="pill">{{ module.length }}</span>
              </td>

              <td>
                <span class="pill">{{ module.prefix }}</span>
              </td>

              <td>
                {{ module.number }}
              </td>

              <td class="text-center">
                <button
                  type="button"
                  class="icon-btn"
                  (click)="editModule(module)">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                </button>
              </td>

            </tr>

            <tr *ngIf="filteredModules.length === 0">
              <td colspan="7" class="empty-state">
                No records found.
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>
  </div>

  <!-- ================= EDIT MODAL ================= -->
  <div
    class="modal fade show"
    *ngIf="showEditModal"
    tabindex="-1"
    style="display:block;background:rgba(0,0,0,.5)">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Edit Document Number
          </h5>

          <button
            type="button"
            class="btn-close"
            (click)="closeModal()">
          </button>

        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">Module Name</label>
            <input
              class="form-control"
              [(ngModel)]="selectedModule.moduleName"
              readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Length</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="selectedModule.length">
          </div>

          <div class="mb-3">
            <label class="form-label">Prefix</label>
            <input
              class="form-control"
              [(ngModel)]="selectedModule.prefix">
          </div>

          <div class="mb-3">
            <label class="form-label">Number</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="selectedModule.number">
          </div>

        </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn erp-btn-secondary"
            (click)="closeModal()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
            Cancel
          </button>

          <button
            type="button"
            class="btn erp-btn-primary"
            (click)="saveModule()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <path d="M17 21v-8H7v8M7 3v5h8"></path>
            </svg>
            Save
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
